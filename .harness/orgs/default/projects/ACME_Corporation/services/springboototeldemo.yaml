service:
  name: springboot-otel-demo
  identifier: springboototeldemo
  orgIdentifier: default
  projectIdentifier: ACME_Corporation
  serviceDefinition:
    spec:
      manifests:
        - manifest:
            identifier: springboototelmanifests
            type: K8sManifest
            spec:
              store:
                type: Github
                spec:
                  connectorRef: ACME_GitHub_Connector
                  gitFetchType: Branch
                  paths:
                    - manifests
                  repoName: simple-springboot-with-otel
                  branch: main
              valuesPaths:
                - manifests/values.yaml
              skipResourceVersioning: false
              enableDeclarativeRollback: false
      artifacts:
        primary:
          primaryArtifactRef: <+input>
          sources:
            - spec:
                connectorRef: ACME_Docker_Connector
                imagePath: geertjanwielenga1/springboot-otel-demo
                tag: <+input>
                digest: ""
              identifier: springboototeldemo
              type: DockerRegistry
    type: Kubernetes
